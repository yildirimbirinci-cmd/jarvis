name: Jarvis Windows Ollama Acceptance

on:
  workflow_dispatch:
    inputs:
      chat_model:
        description: Local Ollama chat model
        required: true
        default: qwen2.5:7b
        type: string
      code_model:
        description: Local Ollama code model
        required: true
        default: qwen2.5-coder:7b
        type: string
      run_full_suite:
        description: Run the complete pytest suite after focused acceptance
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: jarvis-windows-ollama-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: Real Windows and Ollama acceptance
    runs-on: [self-hosted, windows, x64, jarvis]
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}
      JARVIS_OLLAMA_URL: http://127.0.0.1:11434
      JARVIS_CHAT_MODEL: ${{ inputs.chat_model }}
      JARVIS_CODE_MODEL: ${{ inputs.code_model }}
    defaults:
      run:
        shell: powershell
        working-directory: artmach_assistant

    steps:
      - name: Checkout repository as Python package
        uses: actions/checkout@v4
        with:
          path: artmach_assistant
          clean: true
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install headless dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }
          if (Test-Path requirements-dev.txt) { python -m pip install -r requirements-dev.txt }
          python -m pip install pytest pytest-timeout requests beautifulsoup4

      - name: Verify package import
        run: python -c "import artmach_assistant; print(artmach_assistant.__file__)"

      - name: Verify local Ollama service and models
        run: |
          $ErrorActionPreference = 'Stop'
          $response = Invoke-RestMethod -Uri "$env:JARVIS_OLLAMA_URL/api/tags" -Method Get -TimeoutSec 15
          $names = @($response.models | ForEach-Object { $_.name })
          Write-Host "Installed Ollama models: $($names -join ', ')"
          foreach ($required in @($env:JARVIS_CHAT_MODEL, $env:JARVIS_CODE_MODEL)) {
            $matched = $names | Where-Object { $_ -eq $required -or $_ -like "$required:*" }
            if (-not $matched) { throw "Required Ollama model is missing: $required" }
          }

      - name: Compile repository
        run: python -m compileall -q .

      - name: Run self-development readiness gate
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          python -m artmach_assistant --self-develop-check --self-develop-report artifacts/self-development-gate.json 2>&1 | Tee-Object -FilePath artifacts/self-development-gate.txt
          if ($LASTEXITCODE -ne 0) { throw "Self-development readiness gate failed: $LASTEXITCODE" }

      - name: Run focused self-development safety suite
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pytest -q `
            tests/test_code_model_acceptance.py `
            tests/test_end_to_end_acceptance.py `
            tests/test_edit_build_safety_group.py `
            tests/test_edit_checkpoint_transaction_group.py `
            tests/test_git_change_service.py `
            tests/test_git_workspace_service.py `
            tests/test_cancellable_ollama.py

      - name: Probe real chat and code models
        run: |
          $ErrorActionPreference = 'Stop'
          $cases = @(
            @{ model=$env:JARVIS_CHAT_MODEL; prompt='Respond with exactly: JARVIS_CHAT_OK' },
            @{ model=$env:JARVIS_CODE_MODEL; prompt='Respond with exactly: JARVIS_CODE_OK' }
          )
          foreach ($case in $cases) {
            $body = @{ model=$case.model; prompt=$case.prompt; stream=$false } | ConvertTo-Json
            $result = Invoke-RestMethod -Uri "$env:JARVIS_OLLAMA_URL/api/generate" -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 180
            if ([string]::IsNullOrWhiteSpace([string]$result.response)) {
              throw "Ollama returned an empty response for model $($case.model)"
            }
            Write-Host "Model probe succeeded: $($case.model)"
          }

      - name: Run complete repository suite
        if: ${{ inputs.run_full_suite }}
        run: python -m pytest -q

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-ollama-acceptance-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artmach_assistant/artifacts/**
            artmach_assistant/**/e2e_latest.json
            artmach_assistant/**/report.json
            artmach_assistant/**/support_bundle.zip
            artmach_assistant/.pytest_cache/**
