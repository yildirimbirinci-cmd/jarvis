name: Jarvis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.11 validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
            setup.cfg

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
          if [[ -f requirements-dev.txt ]]; then python -m pip install -r requirements-dev.txt; fi
          python -m pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q config.py core indexing tests tools app.py start_jarvis.py

      - name: Run platform-neutral acceptance tests
        run: >-
          python -m pytest -q
          tests/test_application_entrypoint.py
          tests/test_code_model_acceptance.py
          tests/test_end_to_end_acceptance.py
          tests/test_edit_build_safety_group.py
          tests/test_edit_checkpoint_transaction_group.py
          tests/test_git_change_service.py
          tests/test_git_workspace_service.py

      - name: Run complete repository suite
        run: python -m pytest -q
