name: Jarvis CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    defaults:
      run:
        working-directory: artmach_assistant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: artmach_assistant

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            pytest-timeout \
            requests \
            beautifulsoup4

      - name: Verify package imports
        run: |
          python -c "import artmach_assistant; print('package import OK')"

      - name: Run self development tests
        run: |
          python -m pytest -x -vv \
            tests/test_own_code_readiness.py \
            tests/test_own_code_closed_loop.py \
            tests/test_own_code_repair_retry.py \
            tests/test_own_code_scope.py \
            tests/test_own_code_dependency_guard.py \
            tests/test_own_code_security_guard.py \
            tests/test_own_code_semantic_guard.py \
            tests/test_own_code_symbol_guard.py \
            tests/test_self_repair_state_machine.py \
            tests/test_git_workspace_service.py
