name: Jarvis CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    defaults:
      run:
        working-directory: artmach_assistant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: artmach_assistant

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            pytest-timeout \
            requests \
            beautifulsoup4

      - name: Verify package imports
        run: |
          python -c "import artmach_assistant; print('package import OK')"

      - name: Run self-development safety tests
        run: |
          python -m pytest -x -vv \
            tests/test_own_code*.py \
            tests/test_self_repair*.py \
            tests/test_patch*.py \
            tests/test_checkpoint*.py \
            tests/test_rollback*.py \
            tests/test_workspace*.py \
            --ignore-glob="tests/*audio*" \
            --ignore-glob="tests/*voice*" \
            --ignore-glob="tests/*wake*" \
            --ignore-glob="tests/*whisper*" \
            --ignore-glob="tests/*piper*" \
            --ignore-glob="tests/*tts*"
