name: Jarvis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    defaults:
      run:
        working-directory: artmach_assistant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: artmach_assistant

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-timeout

      - name: Verify package imports
        run: |
          python -c "import artmach_assistant; print('package import OK')"

      - name: Collect first test error
        run: |
          python -m pytest tests --collect-only -x -vv
